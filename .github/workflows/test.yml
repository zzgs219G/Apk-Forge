name: 单元测试

# ============================================================
#  ApkForge · 云端单元测试
#
#  【为什么单独一个 workflow】
#  打包流水线是手动触发 / 打标签才跑的，周期长。而改注入逻辑时
#  最需要的是「每次 push 自动告诉我有没有改坏」。
#  所以这里只跑测试，不打包。
#
#  【为什么要先 assembleDebug】
#  本工程的测试**靶子是真实 APK**（`app-debug.apk`），不是伪造的 dex 片段。
#  真实包的形态（多 dex、Compose 大方法、R8 折叠）是伪造样本覆盖不到的。
#  `DexPatcherTest` 找的就是那个文件，顺序反了会全部找不到靶子。
#
#  【哪些测试会 skip】
#  `RealReleaseApkTest` 需要一个 52MB 的真实 release 包
#  （`~/sample-release.apk`），它没有入库（.gitignore 忽略 *.apk）。
#  CI 上这组会按 `assumeTrue` 跳过 —— 这是设计好的，不伪绿。
# ============================================================

on:
  push:
    branches: [main]
    paths:
      - "app/src/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 设置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: on-failure

      - name: 准备 Android SDK
        run: sh .cnb/scripts/ensure-sdk.sh

      # ---------- 测试样本 ----------
      # `RealReleaseApkTest` / `PoolInjectorTest` 需要 52MB 的真实 release 包。
      # `.gitignore` 排除了 `*.apk`（不该让仓库背上 50MB 历史），
      # 所以放在 GitHub Release 上当附件，CI 按需下载。
      #
      # ⚠️ 下载失败不该让整个 CI 红：那只是少覆盖一个场景，
      # 相关测试会用 `assumeTrue` 跳过。但要**明确打印**出来，
      # 不能让「跳过」悄悄发生 —— 绿了却少跑关键测试是最坏的情况。
      - name: 下载真实 APK 样本
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "尝试从 Release 下载测试样本…"
          # 放到**项目根**：Gradle test 任务的工作目录是模块目录（app/），
          # 测试代码会依次查 `sample-release.apk` / `app/` / `../`，
          # 项目根能命中 `../sample-release.apk`。
          if gh release download test-fixtures-v1 \
               --repo "${{ github.repository }}" \
               --pattern "sample-release.apk" \
               --dir . --clobber; then
            ls -la sample-release.apk
            echo "✅ 样本就绪，RealReleaseApkTest 会真跑"
          else
            echo "::warning::样本下载失败，RealReleaseApkTest / RealReleaseIncrementalTest 将被跳过"
          fi

      # assets/sample/DemoDialog.dex 是构建产物，CI 上必须重新生成
      - name: 生成示例 payload dex
        run: |
          set -e
          SDK="${ANDROID_SDK:-${ANDROID_HOME:-$ANDROID_SDK_ROOT}}"
          ANDROID_SDK="$SDK" bash tools/sample-payload/build.sh
          head -c 4 app/src/main/assets/sample/DemoDialog.dex | grep -q "dex" || {
            echo "❌ 示例 dex 魔数错误"; exit 1; }

      # 测试靶子必须先构建出来
      - name: 预构建测试靶子（app-debug.apk）
        run: |
          set -o pipefail
          mkdir -p build-log
          ./gradlew assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            --stacktrace --console=plain \
            2>&1 | tee build-log/prebuild.log

      - name: 跑单元测试
        run: |
          set -o pipefail
          mkdir -p build-log
          ./gradlew testDebugUnitTest \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            --stacktrace --console=plain \
            2>&1 | tee build-log/test.log

      - name: 汇总测试结果
        if: always()
        shell: bash
        run: |
          REPORT=app/build/test-results/testDebugUnitTest
          {
            echo "## 测试结果"
            echo ""
            echo "| 用例数 | 失败 | 跳过 |"
            echo "|---|---|---|"
            T=0; F=0; S=0
            for f in "$REPORT"/*.xml; do
              [ -e "$f" ] || continue
              t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              ff=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              ss=$(grep -o 'skipped="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              T=$((T+${t:-0})); F=$((F+${ff:-0})); S=$((S+${ss:-0}))
            done
            echo "| $T | $F | $S |"
            echo ""
            if [ "$F" -gt 0 ]; then
              echo "### 失败的用例"
              grep -l 'failures="[1-9]' "$REPORT"/*.xml 2>/dev/null | while read -r f; do
                grep -oE '<testcase name="[^"]*"' "$f" | sed 's/<testcase name="/- /; s/"$//'
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 测试报告
          path: |
            build-log/
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 7
