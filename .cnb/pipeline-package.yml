          echo "已从镜像恢复依赖 $(du -sh /workspace/.gradle-home | cut -f1)"
        else
          echo "缓存镜像内无 /space/gradle-home，本次将重新下载依赖"
        fi
    - name: 准备 Android SDK
      # 逻辑收敛到 .cnb/scripts/ensure-sdk.sh，三个入口共用一份。
      # 镜像已预装 platforms;android-37.0 + build-tools;37.0.0，
      # 脚本检测到就位会直接跳过安装。
      script: "set -e\nsh .cnb/scripts/ensure-sdk.sh\n"
    - name: 生成示例 payload dex
      # assets/sample/DemoDialog.dex 是「载入示例」功能的依赖，
      # 它是构建产物而非源文件，CI 上必须重新生成。
      # 只传 SDK 根目录：android.jar 与 d8 由 build.sh 自己探测。
      # 这里传死路径等于把探测逻辑废掉（android-37 与 android-37.0 都出现过）。
      script: "set -e\nSDK=\"${ANDROID_SDK:-${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}}\"\necho \"SDK=$SDK\"\nANDROID_SDK=\"$SDK\" bash tools/sample-payload/build.sh\nls -la app/src/main/assets/sample/\n# 魔数校验：不是合法 dex 当场失败，别等运行时才发现示例用不了\nhead -c 4 app/src/main/assets/sample/DemoDialog.dex | grep -q dex || {\n  echo \"示例 dex 魔数错误\"; exit 1; }\n"
    - name: 确定打包类型
      script: "GRADLE_TASK=\"assembleRelease\"; PKG_TYPE=\"正式版\"\nmkdir -p /tmp/cnb\necho \"GRADLE_TASK='$GRADLE_TASK'\" >> /tmp/cnb/vars.sh\necho \"PKG_TYPE='$PKG_TYPE'\" >> /tmp/cnb/vars.sh\n"
    - name: 准备签名配置
      script: "if [ -n \"$KEYSTORE_BASE64\" ]; then\n  echo \"$KEYSTORE_BASE64\" | base64 -d > release.keystore\n  { echo \"storeFile=release.keystore\"; echo \"storePassword=$KEYSTORE_STORE_PASSWORD\"; echo \"keyAlias=$KEYSTORE_KEY_ALIAS\"; echo \"keyPassword=$KEYSTORE_KEY_PASSWORD\"; } > release.properties\n  echo \"✔ 已使用 Secrets 中的签名密钥\"\nelse\n  echo \"❌ 标签发布必须配置 KEYSTORE_BASE64，否则无法签名\"; exit 1\nfi\n"
    - name: 执行打包
      # 用缓存镜像而非基础镜像：它预装了 SDK 37 + build-tools 37.0.0，
      # 否则每次都要现场 sdkmanager 下载（/opt 下，任何 volume 都缓存不到）。
      #
      # ⚠️ 本阶段跑在独立容器里，取不到上一 stage 写在 /tmp/cnb/vars.sh 的变量
      #    （/tmp 不跨容器）。故这里按同一规则重算 GRADLE_TASK 并重建 vars.sh。
      #    规则与「确定打包类型」stage 必须保持一致。
      image: $GRADLE_CACHE_IMAGE
      env:
        # 指向 docker.volumes 挂载点：同节点重复构建时复用依赖与 build-cache
        GRADLE_USER_HOME: /workspace/.gradle-home
      script: |
        set -e
        # 缓存镜像的 WORKDIR 是 /space（只放依赖清单），仓库代码挂在 /workspace。
        cd /workspace
        mkdir -p /tmp/cnb
        sh .cnb/scripts/resolve-version.sh
        if [ "$CNB_IS_TAG" = "true" ] || [ "$build_type" = "正式版(release)" ]; then
          GRADLE_TASK="assembleRelease"; PKG_TYPE="正式版"
        elif [ "$build_type" = "全部(both)" ]; then
          GRADLE_TASK="assembleDebug assembleRelease"; PKG_TYPE="全部"
        else
          GRADLE_TASK="assembleDebug"; PKG_TYPE="测试版"
        fi
        echo "GRADLE_TASK='$GRADLE_TASK'" >> /tmp/cnb/vars.sh
        echo "PKG_TYPE='$PKG_TYPE'" >> /tmp/cnb/vars.sh
        echo "log_level='$log_level'" >> /tmp/cnb/vars.sh
        echo "打包任务=$GRADLE_TASK"
        sh .cnb/scripts/gradle-build.sh
    - name: 整理 APK
      script: "[ -f /tmp/cnb/vars.sh ] && . /tmp/cnb/vars.sh\nset -e\nmkdir -p dist\nSHA=$(git rev-parse --short HEAD); DATE=$(date +%Y%m%d-%H%M)\ncp app/build/outputs/apk/release/*.apk \"dist/ApkForge-正式版-v${VERSION_NAME}_${VERSION_CODE}-${DATE}-${SHA}.apk\"\nsha256sum dist/*.apk > dist/checksums.txt\nls -lh dist/\n"
    - name: 上传 APK 到附件
      image: cnbcool/attachments:latest
      settings:
        type: UPLOAD
        attachments:
        - dist/*.apk
        - dist/checksums.txt
        ttl: 7
    - name: 收集构建日志
      if: always()
      script: "mkdir -p build-log/daemon\nfor d in /workspace/.gradle-home/daemon \"$HOME\"/.gradle/daemon; do cp -f \"$d\"/*/*.out.log build-log/daemon/ 2>/dev/null || true; done\n{ echo \"# Gradle 守护进程日志\"; for f in build-log/daemon/*.out.log; do [ -e \"$f\" ] || continue; echo \"===== $(basename \"$f\") =====\"; tail -n 2000 \"$f\"; done; } > build-log/gradle-daemon.log 2>/dev/null || true\n[ -s build-log/gradle-daemon.log ] || echo \"无 daemon 日志\" > build-log/gradle-daemon.log\n"
    - name: 上传构建日志到附件
      if: always()
      image: cnbcool/attachments:latest
      settings:
        type: UPLOAD
        attachments:
        - build-log/*.log
        ttl: 7
