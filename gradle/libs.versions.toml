[versions]
agp = "9.3.0"
kotlin = "2.4.10"
coreKtx = "1.17.0"
lifecycleRuntimeKtx = "2.9.2"
activityCompose = "1.11.0"
composeBom = "2026.08.00"

# material3 需显式覆盖 BOM 版本：BOM 2026.08.00 默认 material3 1.4.0，
# 没有 motionScheme（M3E 语义动画槽）。升至 1.5.0-alpha26 后
# defaultSpatialSpec / defaultEffectsSpec / fastEffectsSpec 全部可用。
material3 = "1.5.0-alpha26"

# 以下三项 ApkForge 暂未引用（没有对应业务代码），先在 catalog 里备好版本，
# 用到时在 app/build.gradle.kts 加一行 implementation 即可，不必再查版本。
navigation = "2.8.5"
coil = "3.0.0"
okhttp = "4.12.0"

# ── APK 注入相关 ─────────────────────────────────────────────
# smali-dexlib2：dex 读写（随机访问、lazy 解析），注入走这条比
#   smali/baksmali 文本往返快一到两个数量级，且不丢 debug_info、
#   不改 dex 版本头（后者会让 ART 按旧接口规则校验，Compose 包必崩）。
#   用 com.android.tools.smali（Google 接手）而非 org.smali（2020 年停更、
#   不认 dex 038/039）。
# apksig / apkzlib：v1-v4 签名与 APK 级 zip 读写，都是 AGP 自用那套。
smaliDexlib2 = "3.0.10"
apksig = "9.5.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

smali-dexlib2 = { group = "com.android.tools.smali", name = "smali-dexlib2", version.ref = "smaliDexlib2" }
apksig = { group = "com.android.tools.build", name = "apksig", version.ref = "apksig" }
apkzlib = { group = "com.android.tools.build", name = "apkzlib", version.ref = "apksig" }
